name: Verify and publish Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: crowclaw-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows installers
        run: npm run tauri build

      - name: Collect and hash release assets
        shell: pwsh
        run: ./scripts/Collect-ReleaseArtifacts.ps1

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: CrowClaw-${{ github.ref_name }}-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* `
            --verify-tag `
            --title "CrowClaw ${{ github.ref_name }}" `
            --notes-file "docs/release-notes/v0.1.0-alpha.1.md" `
            --prerelease
