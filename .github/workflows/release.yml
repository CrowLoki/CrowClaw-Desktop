name: Verify and publish Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crowclaw-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    outputs:
      release_version: ${{ steps.release_identity.outputs.release_version }}
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
      release_notes_path: ${{ steps.release_identity.outputs.release_notes_path }}
      executable_hash: ${{ steps.candidate_identity.outputs.executable_hash }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - name: Validate release identity and notes
        id: release_identity
        shell: pwsh
        run: |
          $package = Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json
          $packageLock = Get-Content -Raw -LiteralPath "package-lock.json" | ConvertFrom-Json -AsHashtable
          $tauri = Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $cargo = cargo metadata `
            --manifest-path "src-tauri/Cargo.toml" `
            --format-version 1 `
            --no-deps `
            --locked | ConvertFrom-Json
          $cargoPackage = $cargo.packages | Where-Object { $_.name -eq "crowclaw-desktop" }

          $version = [string]$package.version
          $versions = [ordered]@{
            "package.json" = $version
            "package-lock.json" = [string]$packageLock["version"]
            "package-lock root package" = [string]$packageLock["packages"][""]["version"]
            "Cargo.toml/Cargo.lock" = [string]$cargoPackage.version
            "tauri.conf.json" = [string]$tauri.version
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "Version mismatch: $($entry.Key) is '$($entry.Value)', expected '$version'."
            }
          }

          $releaseTag = "v$version"
          $notesPath = "docs/release-notes/$releaseTag.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Release notes do not exist: $notesPath"
          }

          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref_type }}" -ne "tag") {
              throw "Release publication requires a tag push."
            }
            if ("${{ github.ref_name }}" -ne $releaseTag) {
              throw "Tag '${{ github.ref_name }}' does not match product version '$releaseTag'."
            }
            if (Select-String -LiteralPath $notesPath -SimpleMatch "PENDING-BEFORE-TAG" -Quiet) {
              throw "Release notes still contain PENDING-BEFORE-TAG acceptance placeholders."
            }
            $requiredTokens = @(
              "{{RELEASE_COMMIT}}",
              "{{GITHUB_ACTIONS_RUN_URL}}",
              "{{WINDOWS_INSTALLER_ASSET}}",
              "{{WINDOWS_INSTALLER_SHA256}}"
            )
            $notes = Get-Content -Raw -LiteralPath $notesPath
            foreach ($token in $requiredTokens) {
              if (-not $notes.Contains($token)) {
                throw "Release notes are missing workflow evidence token '$token'."
              }
            }
          }

          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify installer identity comparison
        shell: pwsh
        run: |
          ./scripts/Test-InstallerIdentity.ps1
          npm run test:verification
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade receipt tests failed.' }

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows installers
        run: npm run tauri build

      - name: Collect and hash release assets
        shell: pwsh
        run: ./scripts/Collect-ReleaseArtifacts.ps1

      - name: Bind the unbundled executable identity
        id: candidate_identity
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "src-tauri/target/release/crowclaw-desktop.exe" -Algorithm SHA256).Hash
          "executable_hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload candidate bundle for independent acceptance
        uses: actions/upload-artifact@v7
        with:
          name: CrowClaw-candidate-${{ github.run_id }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  installed-acceptance:
    name: Installed acceptance (${{ matrix.mode }})
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    steps:
      - name: Check out the exact verification scripts
        uses: actions/checkout@v7

      - name: Set up verification Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download the exact candidate bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: CrowClaw-candidate-${{ github.run_id }}
          path: release

      - name: Fetch the verified published Alpha 3 upgrade baseline
        if: matrix.mode == 'upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP "CrowClaw-alpha3-${{ github.run_id }}"
          if (Test-Path -LiteralPath $baseline) { throw 'Baseline directory already exists.' }
          gh release download v0.1.0-alpha.3 --repo '${{ github.repository }}' --pattern 'release-manifest.json' --pattern 'CrowClaw_0.1.0-alpha.3_x64-setup.exe' --dir $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the published upgrade baseline.' }
          $manifest = Get-Content -LiteralPath (Join-Path $baseline 'release-manifest.json') -Raw | ConvertFrom-Json
          $expectedHash = 'c46b2e646410bbb620a20fb94ae743d1538d9093aaf6b043b6bab58b578feb74'
          $asset = @($manifest.assets | Where-Object { $_.name -eq 'CrowClaw_0.1.0-alpha.3_x64-setup.exe' })
          if ($manifest.version -ne '0.1.0-alpha.3' -or $manifest.commit -ne '7874429d0316667584589e40213e91cc2e210f8d' -or $asset.Count -ne 1 -or $asset[0].sha256 -ne $expectedHash) { throw 'Published baseline identity changed.' }
          if ((Get-FileHash -LiteralPath (Join-Path $baseline $asset[0].name) -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Baseline download hash mismatch.' }

      - name: Verify installed candidate and uninstall retention
        shell: pwsh
        env:
          ACCEPTANCE_MODE: ${{ matrix.mode }}
          EXPECTED_EXECUTABLE_HASH: ${{ needs.windows-build.outputs.executable_hash }}
          EXPECTED_VERSION: ${{ needs.windows-build.outputs.release_version }}
        run: |
          $manifest = Get-Content -LiteralPath "release/release-manifest.json" -Raw | ConvertFrom-Json
          $head = (git rev-parse HEAD).Trim()
          if ($manifest.commit -ne $head -or $manifest.version -ne $env:EXPECTED_VERSION) { throw 'Candidate does not match this source/version.' }
          $installer = @($manifest.assets | Where-Object { $_.name -like '*.exe' })
          if ($installer.Count -ne 1 -or [IO.Path]::GetFileName($installer[0].name) -ne $installer[0].name) { throw 'Expected exactly one named NSIS installer.' }
          $parameters = @{
            InstallerPath = (Join-Path "release" $installer[0].name)
            ExpectedInstallerSha256 = $installer[0].sha256
            ExpectedExecutableSha256 = $env:EXPECTED_EXECUTABLE_HASH
            ExpectedVersion = $manifest.version
          }
          if ($env:ACCEPTANCE_MODE -eq 'upgrade') {
            $parameters.PreviousInstallerPath = Join-Path $env:RUNNER_TEMP "CrowClaw-alpha3-${{ github.run_id }}/CrowClaw_0.1.0-alpha.3_x64-setup.exe"
            $parameters.PreviousInstallerSha256 = 'c46b2e646410bbb620a20fb94ae743d1538d9093aaf6b043b6bab58b578feb74'
            $parameters.PreviousVersion = '0.1.0-alpha.3'
          }
          ./scripts/Test-InstalledCrowClaw.ps1 @parameters

      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CrowClaw-native-acceptance-${{ matrix.mode }}-${{ github.run_id }}
          path: output/playwright/*
          if-no-files-found: ignore
          retention-days: 30

  publish-release:
    needs: [windows-build, installed-acceptance]
    if: success() && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7

      - name: Download the accepted candidate bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: CrowClaw-candidate-${{ github.run_id }}
          path: release

      - name: Bind public release notes to verified assets
        id: public_notes
        shell: pwsh
        env:
          RELEASE_NOTES_SOURCE: ${{ needs.windows-build.outputs.release_notes_path }}
          RELEASE_TAG: ${{ needs.windows-build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.windows-build.outputs.release_version }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "CrowClaw-$env:RELEASE_TAG-release-notes.md"
          $headCommit = (git rev-parse HEAD).Trim()
          $parameters = @{
            SourcePath = $env:RELEASE_NOTES_SOURCE
            ManifestPath = "release/release-manifest.json"
            OutputPath = $output
            RunUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            ExpectedVersion = $env:RELEASE_VERSION
            ExpectedCommit = $headCommit
          }
          ./scripts/New-PublicReleaseNotes.ps1 @parameters
          "public_release_notes_path=$output" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: CrowClaw-${{ needs.windows-build.outputs.release_tag }}-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.windows-build.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.public_notes.outputs.public_release_notes_path }}
        run: |
          gh release create "$env:RELEASE_TAG" release/* --verify-tag --title "CrowClaw $env:RELEASE_TAG" --notes-file "$env:RELEASE_NOTES_PATH" --prerelease
